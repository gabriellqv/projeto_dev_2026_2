name: CI

on:
  push:
    branches:
      - main
      - develop
      - 'feat/**'
      - 'fix/**'
      - 'docs/**'
      - 'chore/**'
  pull_request:
    branches:
      - main
      - develop

jobs:
  quality:
    name: Qualidade e Testes
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: odontoagenda
          POSTGRES_PASSWORD: odontoagenda
          POSTGRES_DB: odontoagenda_test
        ports:
          - 5432:5432
        options: --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5

    env:
      DATABASE_URL: postgresql://odontoagenda:odontoagenda@localhost:5432/odontoagenda_test?schema=public
      JWT_SECRET: chave-secreta-de-teste-ci-minimo-32-caracteres
      ADMIN_PASSWORD: senha-admin-teste-ci-123
      VITE_API_URL: http://localhost:3000/api
      NODE_ENV: test

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configura Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Instala dependências
        run: npm ci

      - name: Gera Prisma Client
        run: npm run db:generate -w backend

      - name: Verifica formatação
        run: npm run format:check

      - name: Roda lint
        run: npm run lint

      - name: Verifica tipos
        run: npm run type-check

      - name: Roda testes unitarios
        run: npm run test

      - name: Roda testes de integracao
        run: npm run test:integration -w backend

      - name: Build
        run: npm run build

      - name: Auditoria de dependências
        run: npm audit --audit-level moderate
        continue-on-error: true
